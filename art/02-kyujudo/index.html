<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>九十度 — THE Bonjin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root { --paper:#FFFEFB; --sumi:#201515; --dai:#FF4F00; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--paper); overflow:hidden; }
  body { color:var(--sumi); font-family:"Shippori Mincho B1","Noto Serif CJK JP","Noto Serif JP","Yu Mincho",serif;
    -webkit-font-smoothing:antialiased; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
  body.drag { cursor:grabbing; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .ui { position:fixed; pointer-events:none; opacity:0; transition:opacity 3s ease 1.2s; mix-blend-mode:multiply; }
  body.on .ui { opacity:1; }
  .mark { left:clamp(20px,3.2vw,48px); bottom:clamp(20px,3.2vw,44px); font-size:13px; letter-spacing:.34em; font-weight:500; }
  .mark i { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--dai); margin-left:.5em; transform:translateY(-1px); }
  .deg { right:clamp(20px,3.2vw,48px); bottom:clamp(20px,3.2vw,44px); font-size:11px; letter-spacing:.3em; text-align:right; white-space:nowrap; }
  body.on .deg { opacity:.6; }
  .deg b { font-weight:500; display:inline-block; min-width:5.2em; }
  .deg span { display:inline-block; width:2.6em; text-align:left; margin-left:.8em; transition:opacity .9s ease; }
  .hint { left:50%; bottom:clamp(20px,3.2vw,44px); transform:translateX(-50%); font-size:11px; letter-spacing:.5em; white-space:nowrap; }
  body.on .hint { opacity:.42; }
  body.touched .hint { opacity:0; transition:opacity 2s ease; }
  .say { position:fixed; top:clamp(28px,9vh,96px); right:clamp(24px,5.2vw,84px); writing-mode:vertical-rl; pointer-events:none;
    font-size:clamp(13px,1.15vw,17px); letter-spacing:.42em; line-height:2.6; height:76vh; mix-blend-mode:multiply; }
  .say span { display:inline-block; opacity:0; filter:blur(8px); transition:opacity 1.6s ease, filter 1.8s ease; }
  .say span.in { opacity:.92; filter:blur(0); }
  .say span.out { opacity:0; filter:blur(10px); transition-duration:1.4s,1.4s; }
  .say em { font-style:normal; color:var(--dai); }
  @media (max-aspect-ratio: 4/5) { .say { font-size:12px; right:14px; top:18px; height:60vh; line-height:2.2; } .hint{ display:none; } }
  .nogl { position:fixed; inset:0; display:none; align-items:center; justify-content:center; font-size:14vw; font-weight:800; }
  body.bg { cursor:grab; touch-action:pan-y; }
  body.bg .hint, body.bg .mark { display:none; }
  body.bg .deg { right:auto; left:clamp(20px,3.2vw,48px); text-align:left; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="nogl" id="nogl">凡人</div>
<div class="say" id="say" aria-live="polite"></div>
<div class="ui mark">THE Bonjin<i></i></div>
<div class="ui hint">まわす　／　打つ</div>
<div class="ui deg" id="deg"><b id="degN"></b><span id="degW"></span></div>

<script>
(() => {
'use strict';
/* 九十度 — one body of ink, hanging in space.
   Seen from the front it reads 凡人. Seen from the side, the very same ink reads THE Bonjin.
   Everything between the two is neither, and is most of what there is. */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha:false, antialias:false, depth:false, stencil:false, powerPreference:'high-performance' });
if (!gl || !gl.getExtension('EXT_color_buffer_float')) { document.getElementById('nogl').style.display = 'flex'; return; }
gl.getExtension('OES_texture_float_linear');

const WORD_A = '凡人', WORD_B = 'THE Bonjin';
// the side reading is set in lines, packed tight so no row of 凡人 goes without ink
const B_LINES = stacked => stacked ? ['THE', 'BON', 'JIN'] : ['THE', 'Bonjin'];
const SAY = ['特別な人間は、いない。', 'いるのは、作り続ける<em>凡人</em>だけ。'];
// ?tone=sepia — the page around it is sepia paper
const SEPIA = new URLSearchParams(location.search).get('tone') === 'sepia';
if(SEPIA){ const r = document.documentElement.style; r.setProperty('--paper', '#F3ECDF'); r.setProperty('--sumi', '#3A2E24'); r.setProperty('--dai', '#C0561E'); }
const FONT = '"Shippori Mincho B1","Noto Serif CJK JP","Noto Serif JP",serif';
const N_MAX = 720000;

/* ───────────────────────── the body: one cloud, two readings ───────────────────────── */
// rasterise a word and return, per world-row, the ink spans (in units of character height, centred)
function rasterWord(word, stacked, ROWS, lines){
  // stacked: 凡 and 人 sit close enough that every row holds ink, so no band is lost from the side reading
  const S = 420, chars = [...word], adv = stacked ? .84 : 1.1;
  let cw = stacked ? S*1.4 : S*(adv*chars.length + .4), ch = stacked ? S*(adv*chars.length + .4) : S*1.4;
  let lay = null;
  if(lines){ // Latin, set line by line: each line's cap top meets the line above, a hair of overlap
    const m = document.createElement('canvas').getContext('2d'); m.font = `800 ${S}px ${FONT}`;
    lay = lines.map(t => { const k = m.measureText(t); return { t, w:k.width, up:k.actualBoundingBoxAscent, dn:k.actualBoundingBoxDescent }; });
    cw = Math.max(...lay.map(l => l.w)) + S*.6; ch = lay.reduce((a,l) => a + l.up + l.dn, 0) + S*.6; }
  const cv = document.createElement('canvas'); cv.width = Math.round(cw); cv.height = Math.round(ch);
  const g = cv.getContext('2d', { willReadFrequently:true });
  g.fillStyle = '#000'; g.fillRect(0,0,cv.width,cv.height); g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `800 ${S}px ${FONT}`;
  let dropX = null;
  if(lay){ g.textBaseline = 'alphabetic'; let y = S*.3;
    lay.forEach((l, i) => { y += l.up - (i ? S*.03 : 0); g.fillText(l.t, cv.width/2, y);
      // the orange drop lands on the dot of the i, when there is one
      const ii = l.t.indexOf('i'); if(ii >= 0 && dropX === null){ g.textAlign = 'left';
        const x0 = cv.width/2 - l.w/2, pre = g.measureText(l.t.slice(0, ii)).width, wi = g.measureText('i').width; dropX = x0 + pre + wi/2; g.textAlign = 'center'; }
      y += l.dn; });
  }
  else chars.forEach((c,i) => { const k = i-(chars.length-1)/2;
    if(stacked) g.fillText(c, cv.width/2, cv.height/2 + k*S*adv); else g.fillText(c, cv.width/2 + k*S*adv, cv.height/2); });
  const w = cv.width, h = cv.height, d = g.getImageData(0,0,w,h).data;
  const m = new Uint8Array(w*h); let r0=h, r1=0, c0=w, c1=0;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(d[(y*w+x)*4] > 127){ m[y*w+x] = 1; if(y<r0) r0=y; if(y>r1) r1=y; if(x<c0) c0=x; if(x>c1) c1=x; }
  r1++; c1++;
  // connected components (to find the dot of 凡)
  const lab = new Int32Array(w*h), comps = [0]; let nl = 0; const st = [];
  for(let i=0;i<w*h;i++){ if(!m[i] || lab[i]) continue; nl++; let area = 0, sx = 0, sy = 0; st.push(i); lab[i] = nl;
    while(st.length){ const p = st.pop(); area++; const px = p%w, py = (p-px)/w; sx += px; sy += py;
      if(px>0 && m[p-1] && !lab[p-1]){ lab[p-1]=nl; st.push(p-1); } if(px<w-1 && m[p+1] && !lab[p+1]){ lab[p+1]=nl; st.push(p+1); }
      if(py>0 && m[p-w] && !lab[p-w]){ lab[p-w]=nl; st.push(p-w); } if(py<h-1 && m[p+w] && !lab[p+w]){ lab[p+w]=nl; st.push(p+w); } }
    comps.push({ area, cx:sx/area, cy:sy/area }); }
  const H = r1-r0, mid = (c0+c1)/2, rows = [];
  for(let j=0;j<ROWS;j++){ const y = Math.min(r1-1, Math.floor(r0 + (j+.5)/ROWS*H)); const spans = []; let len = 0, s = -1;
    for(let x=c0;x<=c1;x++){ const on = x<c1 && m[y*w+x];
      if(on && s<0) s = x; else if(!on && s>=0){ spans.push({ a:(s-mid)/H, b:(x-mid)/H, lab:lab[y*w+s] }); len += (x-s)/H; s = -1; } }
    rows.push({ spans, len }); }
  const lastC = dropX !== null ? (dropX - mid)/H : stacked ? 0 : (cv.width/2 + (chars.length-1)/2*S*adv - mid)/H;
  return { rows, comps, half:(c1-c0)/2/H, lastC };
}
function inv(row, u){ let t = u*row.len; for(const s of row.spans){ const l = s.b-s.a; if(t <= l) return [s.a+t, s]; t -= l; } const s = row.spans[row.spans.length-1]; return [s.b, s]; }

let body = null;   // { n, half, tall, vao }
function buildBody(stacked){
  const ROWS = stacked ? 1100 : 560;
  const A = rasterWord(WORD_A, stacked, ROWS), B = rasterWord(WORD_B, stacked, ROWS, B_LINES(stacked));
  // the dot of 凡: the smallest real island of ink in the first word
  let dot = 0, best = 1e9; const minA = 420*420*.002;
  A.comps.forEach((c,i) => { if(i && c.area > minA && c.area < best){ best = c.area; dot = i; } });
  if(A.comps.length < 3) dot = 0;
  // where the orange lives when read from the side: the i of Bonjin
  const zc = B.lastC;
  const dotY = { mid:0, half:1 }; if(dot){ let j0 = ROWS, j1 = 0; for(let j=0;j<ROWS;j++) if(A.rows[j].spans.some(s => s.lab === dot)){ j0 = Math.min(j0,j); j1 = Math.max(j1,j); }
    dotY.mid = .5 - (j0+j1+1)/2/ROWS; dotY.half = (j1-j0+1)/2/ROWS; }
  const cum = new Float64Array(ROWS); let tot = 0;
  for(let j=0;j<ROWS;j++){ const a = A.rows[j].len, b = B.rows[j].len; tot += (a>0 && b>0) ? Math.max(a,b) : 0; cum[j] = tot; }
  const SHEETS = 7, sh = [];
  for(let s=0;s<SHEETS;s++) sh.push({ dir: s%2 ? -1 : 1, off: Math.random(), amp:.08+Math.random()*.22, f:.6+Math.random()*1.5, ph:Math.random(), amp2:.02+Math.random()*.05, f2:3+Math.random()*5, ph2:Math.random() });
  const n = N_MAX, data = new Float32Array(n*5);
  const yScale = stacked ? 2.14 : 1;   // stacked words are ~2.1 characters tall
  for(let i=0;i<n;i++){
    const r = Math.random()*tot; let lo = 0, hi = ROWS-1; while(lo<hi){ const md = (lo+hi)>>1; if(cum[md] < r) lo = md+1; else hi = md; }
    const j = lo, ra = A.rows[j], rb = B.rows[j];
    const yn = .5 - (j + Math.random())/ROWS;
    const u = Math.random(); const [x, sa] = inv(ra, u);
    const isDot = dot && sa.lab === dot;
    let z;
    if(isDot){ // read from the side, the dot becomes a drop held inside the spine of 中
      let bs = rb.spans[0], bd = 1e9; for(const s of rb.spans){ const dd = zc < s.a ? s.a-zc : zc > s.b ? zc-s.b : 0; if(dd < bd){ bd = dd; bs = s; } }
      const t = (yn - dotY.mid)/dotY.half, hw = .2*dotY.half + .62*dotY.half*Math.sqrt(Math.max(0, 1-t*t));
      const c = Math.max(bs.a, Math.min(bs.b, zc)), a = Math.max(bs.a, c-hw), b = Math.min(bs.b, c+hw); z = a + Math.random()*(b-a); }
    else if(Math.random() < .1){ z = inv(rb, Math.random())[0]; }                       // a little mist, bound to no veil
    else { const s = sh[(Math.random()*SHEETS)|0];
      let v = s.dir*u + s.off + s.amp*Math.sin(6.2832*(s.f*yn + s.ph)) + s.amp2*Math.sin(6.2832*(s.f2*yn + s.ph2)) + (Math.random()-.5)*.012;
      v -= Math.floor(v); z = inv(rb, v)[0]; }
    const o = i*5; data[o] = x*1; data[o+1] = yn*yScale; data[o+2] = z; data[o+3] = Math.random(); data[o+4] = isDot ? 1 : 0;
    if(stacked){ data[o] = x*yScale; data[o+2] = z*yScale; }
  }
  // shuffle is implicit (independent samples), so drawing a prefix is an unbiased thinning
  if(body){ gl.deleteBuffer(body.buf); gl.deleteVertexArray(body.vao); }
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao); const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 20, 16);
  gl.bindVertexArray(null);
  // ink area as seen from the front, in (character-height)² — used to normalise darkness
  let area = 0; for(let j=0;j<ROWS;j++) area += Math.max(A.rows[j].len, B.rows[j].len)/ROWS; area *= yScale*(stacked?yScale:1);
  const half = Math.max(A.half, B.half)*(stacked?yScale:1);
  body = { n, vao, buf, area, half, tall:yScale, stacked, hasDot:!!dot };
}

/* ───────────────────────── shaders ───────────────────────── */
const VS_PT = `#version 300 es
precision highp float;
layout(location=0) in vec4 a; layout(location=1) in float kind;
uniform mat3 R; uniform vec2 sc; uniform float time, turb, pxUnit, weight, dof, base, born;
uniform vec4 impO[4]; uniform vec4 impD[4];   // origin.xyz + age, dir.xyz + strength
out float vW; out float vK;
vec3 flow(vec3 q, float t){
  return vec3( sin(q.y*2.3 + t*.37 + 1.7*sin(q.z*1.1 - t*.21)) + .5*sin(q.z*5.1 - t*.5 + q.x*2.),
               sin(q.z*1.9 - t*.29 + 1.7*sin(q.x*1.3 + t*.17)) + .5*sin(q.x*4.7 + t*.43 + q.y*2.),
               sin(q.x*2.1 + t*.33 + 1.7*sin(q.y*1.2 - t*.19)) + .5*sin(q.y*5.3 - t*.47 + q.z*2.) );
}
vec3 rnd3(float s){ return fract(sin(vec3(s*91.7, s*47.3+3.1, s*173.9+7.7))*43758.5453)*2.-1.; }
void main(){
  vec3 p = a.xyz; float s = a.w;
  // most ink keeps its place; a few threads stray far — the fraying edge
  float loose = .35 + 1.3*s*s + 5.*pow(s, 14.);
  p += flow(p*1.25 + s*.35, time) * turb * loose;
  p += flow(p*3.1 + 7., time*1.6) * turb * .3 * loose;
  // blows
  for(int i=0;i<4;i++){ float age = impO[i].w, str = impD[i].w; if(str <= 0.) continue;
    vec3 rel = p - impO[i].xyz; vec3 d = impD[i].xyz; vec3 rad = rel - d*dot(rel,d); float r = length(rad);
    float env = (1.-exp(-age*16.)) * exp(-age*1.25) * (1. + .25*sin(age*5.)*exp(-age*.8));
    float reach = 1./(1. + pow(r/.3, 2.2));
    vec3 dir = rad/(r+.02) + rnd3(s+float(i))*.8;
    p += dir * str * env * reach * (.25 + 1.6*s);
  }
  vec3 v = R * p;
  gl_Position = vec4(v.xy*sc, 0., 1.);
  float coc = abs(v.z) * dof * pxUnit;
  float size = base + coc;                      // gaussian sigma in px
  // birth: ink arrives thread by thread
  float b = smoothstep(s*.7, s*.7+.3, born);
  gl_PointSize = max(2., size*5.) ;
  vW = weight * b / (3.14159*size*size); vK = kind;
}`;
const FS_PT = `#version 300 es
precision highp float; in float vW; in float vK; out vec4 o;
void main(){ vec2 d = (gl_PointCoord-.5)*5.; float g = exp(-dot(d,d)); float w = vW*g; o = vec4(w*(1.-vK), w*vK, 0., 1.); }`;
const VS = `#version 300 es
in vec2 p; out vec2 vUv; void main(){ vUv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
const FS_SHOW = `#version 300 es
precision highp float; precision highp sampler2D; in vec2 vUv; out vec4 o;
uniform sampler2D uD; uniform float aspect;
const vec3 PAPER = vec3(${SEPIA ? '.95294, .92549, .87451' : '1., .99608, .98431'}), SUMI = vec3(${SEPIA ? '.22745,.18039,.14118' : '.12549,.08235,.08235'}), DAI = vec3(${SEPIA ? '.75294,.33725,.11765' : '1.,.30980,0.'});
void main(){
  vec4 d = texture(uD, vUv);
  vec2 so = vec2(.008/aspect, -.013);
  vec4 s1 = textureLod(uD, vUv+so, 4.), s2 = textureLod(uD, vUv+so*2.4, 6.);
  float sh = (1.-exp(-(s1.r+s1.g)*.9))*.06 + (1.-exp(-(s2.r+s2.g)*1.2))*.04;
  float as = 1.-exp(-d.r);
  as = smoothstep(0., 1., as*1.03);
  float ao = smoothstep(.12, .55, 1.-exp(-d.g*1.4));
  vec3 c = mix(PAPER, SUMI, sh*(1.-as));
  c = mix(c, SUMI, as);
  c = mix(c, DAI, ao);
  o = vec4(c, 1.);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
function prog(v, f){ const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, v)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, f)); gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(pr));
  const u = {}; const n = gl.getProgramParameter(pr, gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const inf = gl.getActiveUniform(pr,i); u[inf.name.replace('[0]','')] = gl.getUniformLocation(pr, inf.name); }
  return { pr, u }; }
const pPt = prog(VS_PT, FS_PT), pShow = prog(VS.replace('in vec2 p;', 'layout(location=0) in vec2 p;'), FS_SHOW);
const triVao = gl.createVertexArray(); gl.bindVertexArray(triVao); const tb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, tb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

/* ───────────────────────── targets ───────────────────────── */
let W=0, H=0, aspect=1, dens=null, quality=1, unitPx=1;
function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = Math.max(2, Math.round(innerWidth*dpr)); H = Math.max(2, Math.round(innerHeight*dpr)); canvas.width = W; canvas.height = H; aspect = W/H;
  const stacked = aspect < .9;
  if(!body || body.stacked !== stacked) buildBody(stacked);
  if(dens){ gl.deleteTexture(dens.tex); gl.deleteFramebuffer(dens.fb); }
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, W, H, 0, gl.RGBA, gl.HALF_FLOAT, null); gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  dens = { tex, fb };
  // pixels per character height
  unitPx = stacked ? Math.min(W*.62, H*.36) : Math.min(H*.56, W*.37);
}

/* ───────────────────────── the turning ───────────────────────── */
const HOLD = 4.6, MOVE = 5.6, PERIOD = 2*(HOLD+MOVE), INTRO = 3.4;
let T = -INTRO, time = 0, born = 0;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function timeline(t){ // → yaw (rad), pitch, align 0..1, phase
  if(t < 0){ const s = 1 + t/INTRO, e = 1-Math.pow(1-s, 3); return { yaw:(-.72)*(1-e), pitch:.16*(1-e), align:Math.pow(e, 3), ph:-1 }; }
  const c = t % PERIOD;
  if(c < HOLD) return { yaw:0, pitch:0, align:1, ph:0, k:c/HOLD };
  if(c < HOLD+MOVE){ const s = ease((c-HOLD)/MOVE); return { yaw:s*Math.PI/2, pitch:.2*Math.sin(Math.PI*s), align:Math.pow(Math.abs(2*s-1), 3), ph:1 }; }
  if(c < 2*HOLD+MOVE) return { yaw:Math.PI/2, pitch:0, align:1, ph:2, k:(c-HOLD-MOVE)/HOLD };
  const s = ease((c-2*HOLD-MOVE)/MOVE); return { yaw:(1-s)*Math.PI/2, pitch:-.2*Math.sin(Math.PI*s), align:Math.pow(Math.abs(2*s-1), 3), ph:3 };
}
// the visitor's hand
const hand = { yaw:0, pitch:0, vy:0, vp:0, down:false, moved:0, x:0, y:0, sx:0, sy:0, energy:0, has:false };
const imps = [0,1,2,3].map(() => ({ o:[0,0,0], d:[0,0,1], age:99, str:0 }));
let impI = 0, curR = [1,0,0, 0,1,0, 0,0,1], curSc = [1,1];
function strike(cx, cy, str=.55){
  // the ray under the finger, in the body's own space (R is orthonormal: world = Rᵀ·view)
  const vx = (cx/innerWidth*2-1)/curSc[0], vy = (1-cy/innerHeight*2)/curSc[1], R = curR;
  const o = [R[0]*vx + R[1]*vy, R[3]*vx + R[4]*vy, R[6]*vx + R[7]*vy], d = [R[2], R[5], R[8]];
  const im = imps[impI++ % 4]; im.o = o; im.d = d; im.age = 0; im.str = str;
}
/* ── the committed turn: a firm drag does not spring home. It keeps turning
      the way it was thrown, to the next reading — a quarter turn, or three
      quarters when the next reading lies the long way round. ── */
let flight = null;
const easeIO = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function alignFromYaw(yaw){ const q = Math.PI/2, d = Math.abs(((yaw % q)+q)%q), f = Math.min(d, q-d)/(q/2); return Math.pow(Math.cos(f*Math.PI/2), 1.3); }
function startFlight(dir){
  const cur = timeline(T).yaw + hand.yaw, TWO = Math.PI*2, STEP = Math.PI/2;
  const legible = a => { const m = ((a % TWO)+TWO)%TWO; return m < 1e-9 || Math.abs(m-STEP) < 1e-9; };
  let target = null, k = dir > 0 ? Math.floor(cur/STEP)+1 : Math.ceil(cur/STEP)-1;
  while(target === null){ const a = k*STEP; if(legible(a)) target = a; k += dir > 0 ? 1 : -1; }
  const m = ((target % TWO)+TWO)%TWO;
  // a spring, not a schedule: it inherits the hand's velocity and settles when it arrives
  flight = { y: cur, v: Math.max(-6, Math.min(6, hand.vy)), from: cur, target,
             fromPitch: timeline(T).pitch + hand.pitch, endT: m < 1e-9 ? 0 : HOLD+MOVE };
  hand.yaw = 0; hand.pitch = 0; hand.vy = 0; hand.vp = 0;
}
/* ── background excursion: a committed throw on the cover turns to the next
      reading, rests a moment, then the page's scroll takes the body back. ── */
let excursion = null;
function startExcursion(dir){
  const cur = scrollYaw + hand.yaw, TWO = Math.PI*2, STEP = Math.PI/2;
  const legible = a => { const m = ((a % TWO)+TWO)%TWO; return m < 1e-9 || Math.abs(m-STEP) < 1e-9; };
  let target = null, k = dir > 0 ? Math.floor(cur/STEP)+1 : Math.ceil(cur/STEP)-1;
  while(target === null){ const a = k*STEP; if(legible(a)) target = a; k += dir > 0 ? 1 : -1; }
  excursion = { y: cur, v: Math.max(-6, Math.min(6, hand.vy)), from: cur, target, phase: 'go', holdT: 0, backFrom: target };
  hand.yaw = 0; hand.pitch = 0; hand.vy = 0; hand.vp = 0;
}
/* ── background mode (?bg): the page's scroll turns the body —
      two full swings across the page, out to THE Bonjin and back to 凡人. ── */
const BG = new URLSearchParams(location.search).has('bg');
let scrollP = 0, scrollYaw = -.72;
if(BG){ document.body.classList.add('bg');
  addEventListener('message', e => { const d = e.data; if(d && d.type === 'bonjin-scroll') scrollP = Math.min(1, Math.max(0, +d.p || 0)); }); }

addEventListener('pointerdown', e => {
  // catch a running sweep where it is: hand it to the hand at the same angle
  // and velocity, so grabbing mid-flight never teleports the ink
  if(flight){ const tl = timeline(T);
    hand.yaw = flight.y - tl.yaw; hand.pitch = (flight.curPitch || 0) - tl.pitch;
    hand.vy = flight.v; hand.vp = 0; flight = null; }
  else if(excursion){ hand.yaw = excursion.y - scrollYaw; hand.vy = excursion.v; hand.vp = 0; excursion = null; }
  hand.down = true; hand.moved = 0; hand.x = hand.sx = e.clientX; hand.y = hand.sy = e.clientY; hand.has = true;
  document.body.classList.add('touched', 'drag'); }, { passive:true });
addEventListener('pointermove', e => {
  if(!hand.has){ hand.x = e.clientX; hand.y = e.clientY; hand.has = true; return; }
  const dx = (e.clientX-hand.x)/innerWidth, dy = (e.clientY-hand.y)/innerHeight; hand.x = e.clientX; hand.y = e.clientY;
  if(hand.down){ hand.moved += Math.abs(dx)+Math.abs(dy); hand.yaw += dx*2.6; hand.pitch += dy*1.4; hand.vy = dx*2.6*60; hand.vp = dy*1.4*60; }
  else { hand.vy += dx*5.; hand.vp += dy*3.; hand.energy = Math.min(1, hand.energy + Math.hypot(dx,dy)*1.5); }
}, { passive:true });
const release = e => { if(!hand.down) return; hand.down = false; document.body.classList.remove('drag');
  if(hand.moved < .012) strike(e.clientX, e.clientY);
  else if(BG && !excursion && Math.abs(hand.yaw) >= .45) startExcursion(Math.sign(hand.yaw));
  else if(!BG && !flight && T >= 0 && Math.abs(hand.yaw) >= .45) startFlight(Math.sign(hand.yaw)); };
addEventListener('pointerup', release, { passive:true }); addEventListener('pointercancel', release, { passive:true });
addEventListener('pointerleave', () => { hand.has = false; });

/* ───────────────────────── words ───────────────────────── */
const sayEl = document.getElementById('say'), degN = document.getElementById('degN'), degW = document.getElementById('degW');
const KAN = ['〇','一','二','三','四','五','六','七','八','九'];
const kan = n => n<10 ? KAN[n] : n<20 ? '十'+(n%10?KAN[n%10]:'') : n<100 ? KAN[Math.floor(n/10)]+'十'+(n%10?KAN[n%10]:'') : '百'+(n%100?kan(n%100):'');
let sayI = -1, sayTimers = [];
function say(i){ sayTimers.forEach(clearTimeout); sayTimers = []; sayEl.innerHTML = ''; sayI = i;
  const tmp = document.createElement('div'); tmp.innerHTML = SAY[i]; let k = 0;
  const walk = (node, parent) => node.childNodes.forEach(c => {
    if(c.nodeType===3) [...c.textContent].forEach(ch => { const s = document.createElement('span'); s.textContent = ch; parent.appendChild(s);
      sayTimers.push(setTimeout(() => s.classList.add('in'), 110*k++ + Math.random()*80)); });
    else { const em = document.createElement('em'); parent.appendChild(em); walk(c, em); } });
  walk(tmp, sayEl);
}
function unsay(){ sayI = -1; sayEl.querySelectorAll('span').forEach(s => setTimeout(() => s.classList.add('out'), Math.random()*500)); }
let lastDeg = '', lastWord = '';
function readout(yaw, pitch){
  let d = Math.round(Math.abs(yaw)*180/Math.PI) % 360; if(d > 180) d = 360-d;
  const flat = Math.abs(pitch) < .02;
  const s = '第' + kan(d) + '度'; if(s !== lastDeg){ degN.textContent = lastDeg = s; }
  const w = flat && d === 0 ? WORD_A : flat && d === 90 ? WORD_B : '';
  if(w !== lastWord){ lastWord = w; if(w) degW.textContent = w; degW.style.opacity = w ? 1 : 0; }
}

/* ───────────────────────── frame ───────────────────────── */
let last = 0, slow = 0, fcount = 0, prevPh = -9;
let dbgYaw = 0, dbgAlign = 1;
function frame(now){
  requestAnimationFrame(frame);
  if(!last){ last = now; return; }
  const raw = (now-last)/1000; last = now; const dt = Math.min(raw, 1/20);
  time += dt; born = Math.min(1.7, born + dt/1.5);
  let yaw, pitch, align;
  if(BG){
    const target = (Math.PI/2) * (1 - Math.cos(scrollP*Math.PI*4)) / 2;
    scrollYaw += (target - scrollYaw) * Math.min(1, dt*2.6);
    if(Math.abs(target - scrollYaw) < .002) scrollYaw = target;
    // the hand still plays on the cover: it springs home, unless a throw was committed
    if(!hand.down && !excursion){ const k = 7., c = 4.6;
      hand.vy += (-k*hand.yaw - c*hand.vy)*dt; hand.vp += (-k*hand.pitch - c*hand.vp)*dt; hand.yaw += hand.vy*dt; hand.pitch += hand.vp*dt; }
    if(excursion){
      const tgt = excursion.phase === 'back' ? scrollYaw : excursion.target;
      const k = 3.4, c = 3.55;
      excursion.v += (-k*(excursion.y - tgt) - c*excursion.v)*dt;
      excursion.y += excursion.v*dt;
      const settled = Math.abs(excursion.y - tgt) < .0015 && Math.abs(excursion.v) < .012;
      if(excursion.phase === 'go' && settled){ excursion.phase = 'hold'; excursion.holdT = 0; excursion.y = tgt; excursion.v = 0; }
      else if(excursion.phase === 'hold'){ excursion.holdT += dt; excursion.y = excursion.target; if(excursion.holdT > 1.15){ excursion.phase = 'back'; excursion.backFrom = excursion.y; } }
      else if(excursion.phase === 'back' && settled){ excursion = null; }
    }
    yaw = excursion ? excursion.y : scrollYaw + hand.yaw;
    pitch = Math.max(-1.2, Math.min(1.2, .06*Math.sin(scrollYaw*2) + hand.pitch));
    if(excursion && excursion.phase !== 'hold'){
      const a = excursion.phase === 'go' ? excursion.from : excursion.backFrom;
      const b = excursion.phase === 'go' ? excursion.target : scrollYaw;
      const p = b === a ? 1 : Math.min(1, Math.max(0, (excursion.y - a)/(b - a)));
      align = Math.pow(Math.abs(2*p-1), 3);
    } else align = alignFromYaw(yaw);
    hand.energy *= Math.exp(-dt*1.6);
    // whichever reading is settled speaks its line (0 and 2q are the same reading)
    const q = Math.PI/2, m = ((yaw % (2*q)) + 2*q) % (2*q);
    const dA = Math.min(Math.abs(m), Math.abs(m - 2*q)), dB = Math.abs(m - q);
    const which = dB < .12 ? 1 : dA < .12 ? 0 : -1;
    if(which !== sayI){ if(which === -1) unsay(); else say(which); }
    readout(yaw, pitch);
  } else if(flight){
    const k = 3.4, c = 3.55;
    flight.v += (-k*(flight.y - flight.target) - c*flight.v)*dt;
    flight.y += flight.v*dt;
    yaw = flight.y;
    // one valley for the whole sweep: the ink loosens once and gathers once,
    // instead of grabbing at every stop it passes
    const p = Math.min(1, Math.max(0, (flight.y - flight.from)/(flight.target - flight.from)));
    align = Math.pow(Math.abs(2*p-1), 3);
    pitch = flight.fromPitch*(1-p);
    flight.curPitch = pitch;
    hand.energy *= Math.exp(-dt*1.6);
    readout(yaw, pitch);
    if(Math.abs(flight.y - flight.target) < .0015 && Math.abs(flight.v) < .012){ T = flight.endT; flight = null; prevPh = -9; }
  } else {
    // while held, time itself waits for the hand
    if(!hand.down) T += dt;
    const tl = timeline(T);
    // the hand's offset springs home once released
    if(!hand.down){ const k = 7., c = 4.6;
      hand.vy += (-k*hand.yaw - c*hand.vy)*dt; hand.vp += (-k*hand.pitch - c*hand.vp)*dt; hand.yaw += hand.vy*dt; hand.pitch += hand.vp*dt; }
    hand.energy *= Math.exp(-dt*1.6);
    yaw = tl.yaw + hand.yaw; pitch = Math.max(-1.2, Math.min(1.2, tl.pitch + hand.pitch));
    const off = Math.min(1, (Math.abs(hand.yaw) + Math.abs(hand.pitch))*2.2);
    align = tl.align*(1-off);
    // words: each reading brings its own line
    if(tl.ph !== prevPh){ if(tl.ph === 0) say(0); else if(tl.ph === 2) say(1); else if(tl.ph === 1 || tl.ph === 3) unsay(); prevPh = tl.ph; }
    readout(yaw, pitch);
  }

  dbgYaw = yaw; dbgAlign = align;
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  // view = Rx(pitch)·Ry(yaw); at yaw=0 → (x,y); at yaw=90° → (z,y)   (column-major for GL)
  const R = [ cy, sp*sy, -cp*sy,   0, cp, sp,   sy, -sp*cy, cp*cy ];
  // slow breathing sway, so that even a finished reading never quite holds still
  const sway = .012*Math.sin(time*.43), cs = Math.cos(sway), ss = Math.sin(sway);
  const Rm = [ R[0]*cs + R[6]*ss, R[1]*cs + R[7]*ss, R[2]*cs + R[8]*ss,  R[3], R[4], R[5],  -R[0]*ss + R[6]*cs, -R[1]*ss + R[7]*cs, -R[2]*ss + R[8]*cs ];
  curR = Rm; curSc = [2*unitPx/W, 2*unitPx/H];
  for(const im of imps) im.age += dt;

  gl.bindFramebuffer(gl.FRAMEBUFFER, dens.fb); gl.viewport(0,0,W,H); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(pPt.pr); const u = pPt.u;
  gl.uniformMatrix3fv(u.R, false, Rm); gl.uniform2f(u.sc, curSc[0], curSc[1]); gl.uniform1f(u.time, time);
  gl.uniform1f(u.turb, .0035 + .04*Math.pow(1-align, 1.6) + .05*hand.energy);
  gl.uniform1f(u.pxUnit, unitPx); gl.uniform1f(u.base, Math.max(.75, unitPx/520)); gl.uniform1f(u.dof, .0035 + .012*(1-align));
  const n = Math.floor(body.n*quality);
  gl.uniform1f(u.weight, 3.4 * body.area*unitPx*unitPx / n); gl.uniform1f(u.born, born);
  const io = new Float32Array(16), id = new Float32Array(16);
  imps.forEach((im,i) => { io.set([im.o[0],im.o[1],im.o[2],im.age], i*4); id.set([im.d[0],im.d[1],im.d[2], im.age < 9 ? im.str : 0], i*4); });
  gl.uniform4fv(u.impO, io); gl.uniform4fv(u.impD, id);
  gl.bindVertexArray(body.vao); gl.drawArrays(gl.POINTS, 0, n);
  gl.disable(gl.BLEND);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0,0,W,H);
  gl.useProgram(pShow.pr); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, dens.tex); gl.generateMipmap(gl.TEXTURE_2D);
  gl.uniform1i(pShow.u.uD, 0); gl.uniform1f(pShow.u.aspect, aspect);
  gl.bindVertexArray(triVao); gl.drawArrays(gl.TRIANGLES, 0, 3);

  // if the machine struggles, thin the ink rather than stutter
  fcount++; if(fcount > 60){ if(raw > 1/40) slow++; else slow = Math.max(0, slow-1);
    if(slow > 60 && quality > .25){ quality *= .7; slow = 0; } }
}
addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 120); });
window.__art = { get T(){return T;}, set T(v){T=v; prevPh=-9;}, strike, hand, get q(){return quality;}, get body(){return body;},
  get yaw(){return dbgYaw;}, get align(){return dbgAlign;},
  get mode(){ return BG ? (excursion ? 'excursion-' + excursion.phase : 'bg') : (flight ? 'flight' : 'tl'); } };

const boot = () => { resize(); document.body.classList.add('on'); requestAnimationFrame(frame); };
const fontReady = document.fonts && document.fonts.load ? Promise.race([
  document.fonts.load(`800 120px "Shippori Mincho B1"`, WORD_A+WORD_B+'BONJIN'), new Promise(r => setTimeout(r, 2500)) ]) : Promise.resolve();
fontReady.then(boot, boot);
})();
</script>
</body>
</html>
